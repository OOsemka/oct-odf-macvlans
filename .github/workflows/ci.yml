name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: pull requests from forks run with no secrets and cannot push.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install --immutable
      - name: Type check
        run: yarn ts-check
      - name: Translation keys
        run: yarn check-i18n
      - name: Repository rules (PatternFly 6, no private data)
        run: yarn check-repo
      - name: Unit tests
        run: yarn test
      - name: Build
        run: yarn build
